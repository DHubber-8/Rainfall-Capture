[project]
name = "woodlands-dashboard-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10,<4",
  "fastapi>=0.115",
  "python-dotenv>=1.0",
  "tzdata>=2024.1",
  "httpx>=0.27",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["."]

